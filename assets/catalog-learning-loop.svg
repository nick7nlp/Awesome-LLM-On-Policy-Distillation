   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="54.432" y="123.443437" transform="rotate(-0 54.432 123.443437)">01</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294a3d" x="54.432" y="153.162325" transform="rotate(-0 54.432 153.162325)">Student rollout</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(54.432 176.799837)">Generate a response</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(54.432 191.709288)">with the current student.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="348.192" y="123.443437" transform="rotate(-0 348.192 123.443437)">02</text>
   </g>
   <g id="text_5">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294a3d" x="348.192" y="153.162325" transform="rotate(-0 348.192 153.162325)">Teacher feedback</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(348.192 176.799837)">Predict next-token distributions</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(348.192 191.709288)">on those same prefixes.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="641.952" y="123.443437" transform="rotate(-0 641.952 123.443437)">03</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #294a3d" x="641.952" y="153.162325" transform="rotate(-0 641.952 153.162325)">Student update</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(641.952 176.799837)">Match student predictions</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #637165" transform="translate(641.952 191.709288)">to the teacher's soft targets.</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637165" x="285.12" y="142.3872" transform="rotate(-0 285.12 142.3872)">Visited prefixes</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #637165" x="578.88" y="142.3872" transform="rotate(-0 578.88 142.3872)">Soft targets</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #294a3d" x="432" y="267.84" transform="rotate(-0 432 267.84)">Repeat with the updated student</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="38.88" y="319.882206" transform="rotate(-0 38.88 319.882206)">The teacher supplies targets; the optimizer computes the update. Teacher predictions can be imperfect.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="38.88" y="336.125406" transform="rotate(-0 38.88 336.125406)">Other OPD methods can use different losses, feedback, or mixtures of trajectories.</text>
   </g>
  </g>
  <g id="text_15">
   <text style="font-weight: 500; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="38.88" y="20.3904" transform="rotate(-0 38.88 20.3904)">OPD / THE LEARNING LOOP</text>
  </g>
  <g id="text_16">
   <text style="font-size: 25px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #294a3d" x="38.88" y="47.0016" transform="rotate(-0 38.88 47.0016)">Learn on the student's own trajectories</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637165" x="38.88" y="67.7376" transform="rotate(-0 38.88 67.7376)">A direct-matching example: collect student prefixes, obtain teacher targets, update the student.</text>
  </g>
 </g>
