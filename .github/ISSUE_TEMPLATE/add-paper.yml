name: "📝 Add Paper"
description: "Suggest a new paper for the Awesome LLM On-Policy Distillation list"
title: "[Paper] "
labels: ["paper-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a paper! Please fill in the details below.
        Make sure the paper meets the [inclusion criteria](https://github.com/nick7nlp/Awesome-LLM-On-Policy-Distillation/blob/master/CONTRIBUTING.md#inclusion).

  - type: input
    id: title
    attributes:
      label: Paper Title
      description: "Full title of the paper"
      placeholder: "e.g., Self-Distilled Reasoner: On-Policy Self-Distillation for Large Language Models"
    validations:
      required: true

  - type: input
    id: arxiv_id
    attributes:
      label: arXiv ID
      description: "arXiv identifier (e.g., 2601.18734)"
      placeholder: "2601.18734"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Publication Date
      description: "Year or YYYY-MM-DD"
      placeholder: "2026"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "Which section does this paper best fit in?"
      options:
        - "§4 Objectives and update rules"
        - "§5 Teacher and supervision construction"
        - "§6 Data and training dynamics"
        - "§7 Agentic and multi-turn distillation"
        - "§8 Mechanisms, failures, and evaluation"
        - "§9 Applications and systems"
        - "Foundations or related background"
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: Key Contribution
      description: "One-line description of the paper's main contribution to OPD"
      placeholder: "Describe the actual state source, teacher signal and update, with the relevant source location."
    validations:
      required: true

  - type: input
    id: models
    attributes:
      label: "Teacher → Student"
      description: "Model pair used in experiments, or N/A for theoretical/background work"
      placeholder: "e.g., Qwen3-32B → Qwen3-4B"
    validations:
      required: true

  - type: input
    id: code_link
    attributes:
      label: Code Link (optional)
      description: "GitHub repository URL if available"
      placeholder: "https://github.com/..."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Any other relevant information (benchmarks, key results, etc.)"
    validations:
      required: false
